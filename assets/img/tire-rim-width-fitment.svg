<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram showing rim width measured between flanges and a warning that a 16 inch tire must not be mounted on a 16.5 inch rim">
<style>text{font:16px sans-serif;fill:#222} .k{font:14px sans-serif;fill:#444} .w{font:18px sans-serif;font-weight:700;fill:#7a1f1f}</style>
<rect width="960" height="540" fill="#f4f1ea"/>
<g transform="translate(80,80)">
  <path d="M20,200 L20,80 L60,40 L300,40 L340,80 L340,200" fill="none" stroke="#1a2332" stroke-width="10"/>
  <path d="M20,200 L20,230 L340,230 L340,200" fill="#c5c9d0" stroke="#1a2332" stroke-width="3"/>
  <line x1="20" y1="20" x2="340" y2="20" stroke="#3b6ea5" stroke-width="3"/>
  <polyline points="20,30 20,10 340,10 340,30" fill="none" stroke="#3b6ea5" stroke-width="2"/>
  <text x="180" y="0" text-anchor="middle">Rim width (inside, flange to flange)</text>
  <text class="k" x="180" y="270" text-anchor="middle">Always match the tire and rim diameter codes</text>
</g>
<g transform="translate(500,90)">
  <rect x="0" y="0" width="400" height="320" fill="#fff" stroke="#c9b8a0"/>
  <text class="w" x="200" y="50" text-anchor="middle">Diameter must match exactly</text>
  <text x="200" y="110" text-anchor="middle">16 in tire  to  16 in rim</text>
  <text x="200" y="155" text-anchor="middle">16.5 in tire  to  16.5 in rim</text>
  <text class="w" x="200" y="220" text-anchor="middle">Do not mix 16 and 16.5</text>
  <text class="k" x="200" y="270" text-anchor="middle">USTMA: a mismatch can break the bead</text>
  <text class="k" x="200" y="295" text-anchor="middle">if the tire is inflated to seat it</text>
</g>
<text class="k" x="40" y="510">Original diagram by Smart Tire Picks, illustrating USTMA rim-width and diameter rules. Not a mounting procedure.</text>
</svg>
