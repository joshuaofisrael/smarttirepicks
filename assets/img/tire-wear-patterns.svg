<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Six labeled examples of abnormal tire tread wear: diagonal, heel and toe, one-sided, both shoulders, center, and cupping">
<style>text{font:16px sans-serif;fill:#2b2b2b} .t{font:13px sans-serif;fill:#444} .h{font:20px sans-serif;fill:#222}</style>
<rect width="960" height="540" fill="#f4f1ea"/>
<text class="h" x="30" y="36">Examples of abnormal tread wear (USTMA Figure 13 names)</text>
<g font-size="14">
<!-- 2x3 grid of tread blocks -->
<!-- diagonal -->
<g transform="translate(30,60)">
  <rect width="280" height="200" rx="8" fill="#fff" stroke="#d7d0c4"/>
  <rect x="40" y="36" width="200" height="110" rx="6" fill="#2f2f2f"/>
  <path d="M55 50 l40 80 M95 50 l40 80 M135 50 l40 80 M175 50 l40 80" stroke="#c4c4c4" stroke-width="8"/>
  <text class="t" x="20" y="175">Diagonal wear</text>
</g>
<g transform="translate(340,60)">
  <rect width="280" height="200" rx="8" fill="#fff" stroke="#d7d0c4"/>
  <rect x="40" y="36" width="200" height="110" rx="6" fill="#2f2f2f"/>
  <path d="M60 48 h40 v20 h-40 z M120 70 h40 v20 h-40 z M180 48 h40 v20 h-40 z M60 100 h40 v20 h-40 z M120 90 h40 v20 h-40 z" fill="#9a9a9a"/>
  <text class="t" x="20" y="175">Heel and toe wear</text>
</g>
<g transform="translate(650,60)">
  <rect width="280" height="200" rx="8" fill="#fff" stroke="#d7d0c4"/>
  <rect x="40" y="36" width="200" height="110" rx="6" fill="#2f2f2f"/>
  <rect x="40" y="36" width="70" height="110" fill="#6a6a6a"/>
  <text class="t" x="20" y="175">One-sided wear</text>
</g>
<g transform="translate(30,300)">
  <rect width="280" height="200" rx="8" fill="#fff" stroke="#d7d0c4"/>
  <rect x="40" y="36" width="200" height="110" rx="6" fill="#2f2f2f"/>
  <rect x="40" y="36" width="55" height="110" fill="#6a6a6a"/>
  <rect x="185" y="36" width="55" height="110" fill="#6a6a6a"/>
  <text class="t" x="20" y="175">Both shoulder wear</text>
</g>
<g transform="translate(340,300)">
  <rect width="280" height="200" rx="8" fill="#fff" stroke="#d7d0c4"/>
  <rect x="40" y="36" width="200" height="110" rx="6" fill="#2f2f2f"/>
  <rect x="95" y="36" width="90" height="110" fill="#6a6a6a"/>
  <text class="t" x="20" y="175">Center wear</text>
</g>
<g transform="translate(650,300)">
  <rect width="280" height="200" rx="8" fill="#fff" stroke="#d7d0c4"/>
  <rect x="40" y="36" width="200" height="110" rx="6" fill="#2f2f2f"/>
  <circle cx="80" cy="90" r="16" fill="#6a6a6a"/>
  <circle cx="140" cy="70" r="14" fill="#6a6a6a"/>
  <circle cx="190" cy="100" r="18" fill="#6a6a6a"/>
  <text class="t" x="20" y="175">Cupping wear</text>
</g>
</g>
</svg>
